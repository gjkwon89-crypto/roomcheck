.toast{z-index:70!important;position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:20;max-width:90vw}
.page{flex:1 1 auto;overflow:auto;padding:12px 16px}
table.t{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
table.t th{padding:6px 8px;border:1px solid #CBD5E1;background:#F1F5F9;font-weight:700;color:#111827;white-space:nowrap}
table.t td{padding:5px 8px;border:1px solid #E2E8F0;color:#374151;vertical-align:top}
.note{font-size:12px;color:#4B5563;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .box{background:#fff;border-radius:10px;padding:16px;width:100%;max-width:420px}
.modal input{width:100%;height:38px;border:1px solid #CBD5E1;border-radius:6px;padding:0 10px;font-size:15px;margin:4px 0 10px}
@media (max-width:820px){aside{width:250px}.grid2{grid-template-columns:minmax(0,1fr)}}

.onlyprint{display:none}
@page{size:A4 portrait;margin:0} /* 여백 0 → 브라우저가 넣는 날짜·파일명·주소·쪽번호 머리글/바닥글이 안 나옴 · 여백은 아래 .prp 안쪽 여백으로 */
/* 인쇄용: 페이지를 직접 나눠 만들고(#prt) 각 페이지에 제목·쪽번호 */
#prt{position:absolute;left:-20000px;top:0;background:#fff}
.prp{width:794px;height:1120px;padding:60px 57px 50px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.prp+.prp{break-before:page;page-break-before:always}
.prh{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid #CBD5E1;padding:0 0 6px;margin-bottom:8px}
.prh h2{margin:0;font-size:20px;color:#111827}.prh .note{font-size:12px}.prh b{margin-left:auto;font-size:16px;color:#1B2A41}
.prb{flex:1 1 auto;min-height:0}.prc .rb{flex:0 0 calc(100% - 18px);width:auto;max-width:calc(100% - 18px);min-width:0}.prc .rl{min-width:0}.prc .rl li>span{display:none}.prc .rfx{flex:0 0 calc(100% - 18px)}.prc>.rg:first-child{border-top:0!important;margin-top:0!important;padding-top:0!important}
.prf{text-align:center;font-size:11px;color:#4B5563;padding-top:4px}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff}
  body.printing #app,body.printing #toast,body.printing #modal{display:none!important}
  body.printing #prt{position:static}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.st .si small{display:block;margin-top:1px}
.critb{font-size:13px;padding:4px 10px;border-radius:999px;background:#eef2f7;color:#334}
.critb.draft{background:#fff4e0;color:#8a5a00}
.critn{margin:0 0 8px;padding:8px 12px;border-radius:8px;background:#fff4e0;color:#8a5a00;font-size:13px}

document.addEventListener('click', function (e) { var b = e.target.closest('[data-a]'); if (b && ACT[b.getAttribute('data-a')]) ACT[b.getAttribute('data-a')](); });
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'projSel') { switchProject(latestUnit(t.value)); return; }
  if (t.id === 'roundSel') { var p0 = projectInfo(S.project); if (t.value === 'new') addRound(); else if (t.value === 'del') { S.confirmDelRound = true; render(); } else if (p0) switchProject(unitId(p0.id, +t.value), true); return; }
  if (t.hasAttribute && t.hasAttribute('data-photo')) { onPhotos(t); return; }
  if (t.hasAttribute && t.hasAttribute('data-ocount')) { setOutCount(t.getAttribute('data-ocount'), parseInt(t.value, 10) || 0); return; }
  if (t.hasAttribute && t.hasAttribute('data-sat')) { onSatFile(t); return; }
  if (t.hasAttribute && t.hasAttribute('data-backup')) { importBackup(t); t.value = ''; return; }
  if (t.hasAttribute && t.hasAttribute('data-school')) { if (S.bldg) setSchool(S.bldg, t.value); return; }
  if (t.hasAttribute && t.hasAttribute('data-wl')) { var k = t.getAttribute('data-wl'), n = parseFloat(t.value); if (isNaN(n) || n < 0) n = k === 'total' ? 100 : 0; upd(function (x) { wallLen(x)[k] = n; }); return; }
  if (t.id === 'roomName') { var v = t.value.trim(); if (v) upd(function (x) { x.name = v; x.ocr = false; }); }
});

// 시작
// 앱 전체는 기기 화면 높이에 맞추고(키보드와 무관), 작은 입력창만 키보드 위 보이는 영역을 따라감
function kbOpen() { var vv = window.visualViewport; return !!vv && window.innerHeight - vv.height > 120; }
function fitScreen() {
  var de = document.documentElement, vv = window.visualViewport;
  if (!kbOpen()) de.style.setProperty('--app-h', Math.round(window.innerHeight) + 'px');
  de.style.setProperty('--vv-top', Math.round(vv ? vv.offsetTop : 0) + 'px');
  de.style.setProperty('--vv-h', Math.round(vv ? vv.height : window.innerHeight) + 'px');
  if (!kbOpen() && (window.scrollY || document.documentElement.scrollTop)) window.scrollTo(0, 0); // 키보드가 닫히면 밀린 화면 되돌림
}
fitScreen();
window.addEventListener('resize', fitScreen);
window.addEventListener('orientationchange', function () { setTimeout(fitScreen, 300); });
if (window.visualViewport) { window.visualViewport.addEventListener('resize', fitScreen); window.visualViewport.addEventListener('scroll', fitScreen); }
document.addEventListener('focusout', function () { setTimeout(function () { window.scrollTo(0, 0); fitScreen(); }, 50); });
var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var IS_STANDALONE = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
function showUsage() {
  var el = document.getElementById('usage'); if (!el) return;
  try { navigator.storage.estimate().then(function (e) { el.textContent = '사용 중 ' + mb(e.usage || 0) + (e.quota ? ' / 가능 ' + mb(e.quota) : ''); }); } catch (e) {}
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
var last = lsGet('rc:last');
S.mod = ['facility', 'indoor', 'outdoor'].indexOf(lsGet('rc:mod')) >= 0 ? lsGet('rc:mod') : 'indoor';
S.projects = lsGet('rc:projects') || [];
openIdb().then(function () { return idbAll(); }).then(function (l) { l.forEach(function (p) { try { localUrls[p.key] = URL.createObjectURL(p.blob); } catch (e) {} }); render(); });
if (last && last.project) switchProject(last.project); else render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function (ok) { S.persist = ok; render(); }); } catch (e) {}
})();
</script>
