.opts{display:flex;flex-direction:column;gap:2px}

.dt .pill{margin-left:6px}
.badge{padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700}
.b-na{background:#F3F4F6;color:#374151}.b-good{background:#DCFCE7;color:#166534}.b-bad{background:#FFEDD5;color:#9A3412}
.defs ul{margin:0;padding:0;list-style:none}
.defs li{display:flex;gap:8px;font-size:12px;padding:1px 0;border-bottom:1px solid #F1F5F9}
.defs li b{flex:0 0 84px;color:#9A3412}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 12px;background:#fff;border-top:1px solid #D1D5DB;flex-wrap:wrap}
.shoot{min-height:42px;padding:0 16px;border:0;border-radius:8px;background:#1D4ED8;color:#fff;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;position:relative;overflow:hidden}
.shoot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.th{width:40px;height:40px;border-radius:5px;background:#CBD5E1;object-fit:cover}
.next{margin-left:auto;min-height:42px;padding:0 18px;border:0;border-radius:8px;background:#1B2A41;color:#fff;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.2}
.next span{font-size:12px;color:#CBD5E1}
.confirm{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 12px;background:#FEF2F2;border-bottom:1px solid #FCA5A5;color:#991B1B}
.empty{flex:1 1 auto;display:flex;align-items:center;justify-content:center;color:#4B5563;font-size:15px;padding:20px;text-align:center}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:20;max-width:90vw}
.page{flex:1 1 auto;overflow:auto;padding:12px 16px}
table.t{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
table.t th{padding:6px 8px;border:1px solid #CBD5E1;background:#F1F5F9;font-weight:700;color:#111827;white-space:nowrap}
table.t td{padding:5px 8px;border:1px solid #E2E8F0;color:#374151;vertical-align:top}
.note{font-size:12px;color:#4B5563;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .box{background:#fff;border-radius:10px;padding:16px;width:100%;max-width:420px}
.modal input{width:100%;height:38px;border:1px solid #CBD5E1;border-radius:6px;padding:0 10px;font-size:15px;margin:4px 0 10px}
@media (max-width:820px){aside{width:250px}.grid2{grid-template-columns:minmax(0,1fr)}}
</style>

];

  w.measure = w.height === '1.2m 이상' ? '창대높이 1.2m 이상' : w.bar === '적용' ? '추락방지봉' : w.project === '예' ? '프로젝트창' : w.stopper === '적용' ? '스토퍼' : '없음';

  { key: 'wSide', label: '유효너비', opts: ['1.8m 이상', '1.8m 미만'], bad: ['1.8m 미만'], when: function (c) { return c.type === '편복도'; } },

];
var STAIR_FORM = [

  var fl = card.keys.map(function (k) { return card[k]; }), fy = fl.filter(function (f) { return f.yes; }).length;
  fl.forEach(function (f) { if (!f.yes) g[7].subs[2].items.push({ bldg: f.bldg, room: f.floor, what: '비치 없음' }); });
  g[7].subs[2].note = '가산점 · 층별 평가 · 비치 ' + fy + '개층 / 화장실 있는 ' + fl.length + '개층';
  return g;
}
function reportSection(rooms) {
  var g = reportGroups(rooms), total = 0;
  var body = g.map(function (sec, gi) {
    var real = function (s) { return s.items.filter(function (x) { return !x.rec; }).length; }; // rec = 권고사항(미흡 개수 제외)
    var n = 0; sec.subs.forEach(function (s) { if (!s.note && !s.quiet) n += real(s); });
    if (gi === 8 && !sec.subs[0].items.length) return '';
    total += n;
    var list = function (items) {
      if (!items.length) return '';
      var order = [], by = {};
      items.forEach(function (x) { if (!by[x.bldg]) { by[x.bldg] = []; order.push(x.bldg); } by[x.bldg].push(x); });
      return '<div class="rb">' + order.map(function (b) {
        return '<div class="rbg"><b class="rbn">' + esc(b) + ' <small>' + by[b].length + '</small></b><ul class="rl">' + by[b].map(function (x) { return '<li>' + esc(x.room) + (x.what ? ' <span>— ' + esc(x.what) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>';
      }).join('') + '</div>';
    };
    var head = '<div class="rg"><div class="rgh"><b>' + (gi + 1) + '. ' + esc(sec.title) + '</b>' + (n ? '<span class="pill ng">미흡 ' + n + '</span>' : '<span class="pill ok">이상 없음</span>') + '</div>';
    if (sec.subs.length === 1 && !sec.subs[0].title) return head + list(sec.subs[0].items) + '</div>';
    return head + sec.subs.map(function (s, si) {
      var c = real(s), rc = s.items.length - c;
      return '<div class="rs"><span class="rst">' + (si + 1) + ') ' + esc(s.title) + '</span>' +
        (s.quiet ? '' : s.note ? '<span class="note">' + esc(s.note) + '</span>' : (c ? '<span class="cnt">' + c + '건</span>' : (rc ? '' : '<span class="note">해당 없음</span>')) + (rc ? '<span class="note">권고 ' + rc + '건</span>' : '')) + list(s.items) + '</div>';
    }).join('') + '</div>';
  }).join('');
  return '<section class="card" style="padding:10px 14px"><h3 style="font-size:15px">항목별 미흡실 <small>미흡 ' + total + '건 · 대분류별</small></h3>' + body + '</section>';
}
// 모달
function modal(title, label, ph, onOk) {
  var m = document.getElementById('modal');
  m.innerHTML = '<div class="modal" role="dialog" aria-label="' + esc(title) + '"><form class="box" id="mf"><h3 style="margin:0 0 8px;font-size:16px">' + esc(title) + '</h3><label style="font-size:13px;color:#374151">' + esc(label) + '<input id="mi" placeholder="' + esc(ph) + '" autocomplete="off"></label>' +
    '<div class="row" style="justify-content:flex-end"><button type="button" class="hb" id="mc">취소</button><button type="submit" class="hb blue">확인</button></div></form></div>';
  var i = document.getElementById('mi'); setTimeout(function () { i.focus(); }, 0);
  document.getElementById('mc').onclick = function () { m.innerHTML = ''; };
  document.getElementById('mf').onsubmit = function (e) { e.preventDefault(); var v = i.value.trim(); if (!v) return; m.innerHTML = ''; onOk(v); };
}
function openNewProject() {
  modal('새 프로젝트', '프로젝트명 (예: 가온고등학교 신축공사)', '프로젝트명', function (name) {
    var id = 'P' + Date.now().toString(36);
    var pr = { id: id, name: name }; S.projects.push(pr); lsSet('rc:projects', S.projects);
    switchProject(id); S.site = defaultSite(); markSite();
    S.bldg = null; S.floor = '1층'; render(); openNewBldg();
  });
}
function openNewBldg() { modal('동 추가', '동 이름 (예: 신관, 다목적강당)', '동 이름', function (n) { if (S.site.bldgList.indexOf(n) < 0) { S.site.bldgList.push(n); markSite(); } goto(n, S.floor || '1층'); }); }
function switchProject(id) {
  S.pick = null;
  S.project = id; S.cur = null; S.door = 0; S.view = 'input';
  loadLocal(id);
  var last = lsGet('rc:last');
  S.bldg = last && last.project === id ? last.bldg : S.site.bldgList[0];
  S.floor = last && last.project === id ? last.floor : (S.site.up[0] || '1층');
  if (S.site.bldgList.indexOf(S.bldg) < 0) S.bldg = S.site.bldgList[0] || null;
  if (S.site.up.indexOf(S.floor) < 0 && S.site.down.indexOf(S.floor) < 0 && !(S.site.roof && S.floor === ROOF) && S.floor !== COMMON) S.floor = S.site.up[0] || '1층';
  ensureAuto(); subscribe(id); saveLocal(); render(); scheduleFlush(200);
}
var tt = null;
function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(tt); tt = setTimeout(function () { el.style.display = 'none'; }, 2200); }

// 이벤트
document.addEventListener('click', function (e) { var b = e.target.closest('[data-a]'); if (b && ACT[b.getAttribute('data-a')]) ACT[b.getAttribute('data-a')](); });
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'projSel') { switchProject(t.value); return; }
  if (t.hasAttribute && t.hasAttribute('data-photo')) { onPhotos(t); return; }
  if (t.hasAttribute && t.hasAttribute('data-backup')) { importBackup(t); t.value = ''; return; }
  if (t.hasAttribute && t.hasAttribute('data-wl')) { var k = t.getAttribute('data-wl'), n = parseFloat(t.value); if (isNaN(n) || n < 0) n = k === 'total' ? 100 : 0; upd(function (x) { wallLen(x)[k] = n; }); return; }
  if (t.id === 'roomName') { var v = t.value.trim(); if (v) upd(function (x) { x.name = v; x.ocr = false; }); }
});

// 시작
var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var IS_STANDALONE = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
function showUsage() {
  var el = document.getElementById('usage'); if (!el) return;
  try { navigator.storage.estimate().then(function (e) { el.textContent = '사용 중 ' + mb(e.usage || 0) + (e.quota ? ' / 가능 ' + mb(e.quota) : ''); }); } catch (e) {}
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
var last = lsGet('rc:last');
S.projects = lsGet('rc:projects') || [];
openIdb().then(function () { return idbAll(); }).then(function (l) { S.photosQ = l.length; l.forEach(function (p) { try { localUrls[p.key] = URL.createObjectURL(p.blob); } catch (e) {} }); render(); });
if (last && last.project) switchProject(last.project); else render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function (ok) { S.persist = ok; render(); }); } catch (e) {}
})();
</script>
